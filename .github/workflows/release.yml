name: Build signed Android release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release version change
        id: version_guard
        run: |
          current_version_name="$(sed -nE 's/^val appVersionName = "([^"]+)"/\1/p' app/build.gradle.kts)"
          current_version_code="$(sed -nE 's/^val appVersionCode = ([0-9]+)/\1/p' app/build.gradle.kts)"
          test -n "$current_version_name"
          test -n "$current_version_code"

          before_sha="${{ github.event.before }}"
          previous_version_code=""

          if [ -n "$before_sha" ] && [ "$before_sha" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before_sha:app/build.gradle.kts" 2>/dev/null; then
            previous_version_code="$(git show "$before_sha:app/build.gradle.kts" | sed -nE 's/^val appVersionCode = ([0-9]+)/\1/p')"
          fi

          if [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
            should_release=true
          elif [ -z "$previous_version_code" ]; then
            should_release=false
          elif [ "$current_version_code" -gt "$previous_version_code" ]; then
            should_release=true
          elif [ "$current_version_code" -eq "$previous_version_code" ]; then
            should_release=false
          else
            echo "appVersionCode must be greater than the previous value: $previous_version_code -> $current_version_code" >&2
            exit 1
          fi

          echo "current_version_name=$current_version_name" >> "$GITHUB_OUTPUT"
          echo "current_version_code=$current_version_code" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "Release versionCode changed: $previous_version_code -> $current_version_code ($should_release)"

      - name: Set up JDK
        if: steps.version_guard.outputs.should_release == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore release keystore
        if: steps.version_guard.outputs.should_release == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-key.jks

      - name: Make Gradle wrapper executable
        if: steps.version_guard.outputs.should_release == 'true'
        run: chmod +x gradlew

      - name: Build signed release APK
        if: steps.version_guard.outputs.should_release == 'true'
        env:
          ANDROID_RELEASE_STORE_FILE: release-key.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Remove release keystore
        if: always() && steps.version_guard.outputs.should_release == 'true'
        run: rm -f release-key.jks

      - name: Read release metadata
        if: steps.version_guard.outputs.should_release == 'true'
        id: metadata
        run: |
          version_name="$(sed -nE 's/^val appVersionName = "([^"]+)"/\1/p' app/build.gradle.kts)"
          version_code="$(sed -nE 's/^val appVersionCode = ([0-9]+)/\1/p' app/build.gradle.kts)"
          short_sha="$(git rev-parse --short HEAD)"
          tag_name="v${version_name}-${version_code}"
          apk_path="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"

          test -n "$version_name"
          test -n "$version_code"
          test -n "$apk_path"

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Verify release APK signature
        if: steps.version_guard.outputs.should_release == 'true'
        env:
          APK_PATH: ${{ steps.metadata.outputs.apk_path }}
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --print-certs "$APK_PATH"

      - name: Create GitHub release
        if: steps.version_guard.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.metadata.outputs.tag_name }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          SHORT_SHA: ${{ steps.metadata.outputs.short_sha }}
          APK_PATH: ${{ steps.metadata.outputs.apk_path }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "sync-health-notion $VERSION_NAME ($SHORT_SHA)" \
              --notes "Automated signed APK build from main commit $GITHUB_SHA."
          fi

      - name: Skip release
        if: steps.version_guard.outputs.should_release != 'true'
        run: |
          echo "appVersionCode is unchanged (${{ steps.version_guard.outputs.current_version_code }}); skipping signed APK release."
